<!DOCTYPE html>
<html lang="th">
<head>
  <!-- BUNJERD_CLOUDFLARE_PROXY_V1 -->
  <!-- BUNJERD_DIRECT_IFRAME_V1 -->
  <link rel="preconnect" href="https://bunjerd-line-webhook.ss-soematerial.workers.dev">
  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
  <!-- BUNJERD_LEAVE_APPROVAL_V1 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Bunjerd 90's Staff Attendance</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{--bg:#0b0b0b;--card:#171717;--card2:#222;--text:#f5f5f5;--muted:#aaa;--accent:#f3b72d;--ok:#68d17a;--bad:#ff6464;--border:#333}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#111,#080808);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif}
    .wrap{width:min(100%,520px);margin:auto;padding:22px 16px 44px}
    .brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;font-size:25px}.sub,.label,.note{color:var(--muted)}.sub{font-size:13px;margin-top:4px}.tag{background:var(--accent);color:#111;font-weight:900;padding:7px 11px;border-radius:999px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px}.profile{display:flex;gap:14px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#252525}.label{font-size:12px;margin-bottom:5px}.value{font-weight:900;font-size:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:var(--card2);padding:14px;border-radius:14px}.hidden{display:none!important}
    .camera{margin-top:12px;min-height:220px;border:1px dashed #555;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0a0a0a}#preview{display:none;width:100%;max-height:430px;object-fit:cover}.placeholder{text-align:center;color:#888}
    input[type=file]{display:none}.filebtn{display:block;margin-top:12px;background:#292929;border:1px solid #444;border-radius:12px;padding:13px;text-align:center;font-weight:800}button{width:100%;border:0;border-radius:15px;padding:16px;margin-top:10px;background:var(--accent);font-size:18px;font-weight:900}button:disabled{opacity:.45}
    .status{display:none;margin-top:14px;padding:16px;border:1px solid var(--border);border-radius:16px;background:#101010}.status.show{display:block}.status.ok{border-color:var(--ok)}.status.error,.status.late{border-color:var(--bad)}.title{font-size:20px;font-weight:900;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #292929}.row:last-child{border-bottom:0}.row span{color:var(--muted)}.debug{margin-top:12px;background:#0d0d0d;padding:10px;border-radius:10px;color:#aaa;font:12px/1.5 monospace;white-space:pre-wrap;word-break:break-word}.server{margin-top:12px;color:var(--muted);font-size:13px}
    .mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .mode-btn{margin:0;background:#252525;color:#ddd;border:1px solid #3a3a3a;font-size:15px;padding:13px}
    .mode-btn.active{background:var(--accent);color:#111;border-color:var(--accent)}
    .field{margin-top:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
    .field input,.field select,.field textarea{width:100%;background:#101010;color:#fff;border:1px solid #3b3b3b;border-radius:12px;padding:13px;font:inherit}
    .field textarea{min-height:100px;resize:vertical}
    .leave-result{margin-top:12px}

  </style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <div><h1>Bunjerd 90's</h1><div class="sub">Staff Attendance</div></div>
    <div class="tag">พนักงาน</div>
  </div>

  <section class="card">
    <div id="loading"><div class="value">กำลังตรวจสอบ LINE...</div><div class="sub">กรุณารอสักครู่</div></div>

    <div id="profile" class="profile hidden">
      <img id="avatar" class="avatar">
      <div>
        <div class="label">พนักงาน</div>
        <div id="name" class="value">-</div>
        <div id="position" class="sub">-</div>
      </div>
    </div>

    <div id="profileError" class="status error"></div>
    <div class="server" id="serverText">กำลังเช็กระบบ...</div>
    <div id="debug" class="debug hidden">Booting...</div>
  </section>

  <section class="card">
    <div class="mini">
      <div class="label">เวลาเข้างาน</div>
      <div id="scheduled" class="value">-</div>
    </div>
  </section>

  <section id="workActions" class="hidden">
    <div class="mode-switch">
      <button id="attendanceModeBtn" class="mode-btn active" type="button">ลงเวลา</button>
      <button id="leaveModeBtn" class="mode-btn" type="button">แจ้งลา</button>
    </div>
  </section>

  <section id="leaveSection" class="card hidden">
    <div class="label">คำขอลา</div>
    <div class="value">แจ้งลา</div>
    <div class="sub">ส่งคำขอให้แอดมินตรวจสอบ</div>

    <div class="field">
      <label for="leaveType">ประเภทการลา</label>
      <select id="leaveType">
        <option value="">เลือกประเภทการลา</option>
        <option value="ลากิจ">ลากิจ</option>
        <option value="ลาป่วย">ลาป่วย</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>
    </div>

    <div class="grid">
      <div class="field">
        <label for="leaveStartDate">วันที่เริ่มลา</label>
        <input id="leaveStartDate" type="date">
      </div>
      <div class="field">
        <label for="leaveEndDate">ถึงวันที่</label>
        <input id="leaveEndDate" type="date">
      </div>
    </div>

    <div class="field">
      <label for="leaveReason">เหตุผล</label>
      <textarea id="leaveReason" placeholder="ระบุเหตุผลการลา"></textarea>
    </div>

    <button id="submitLeave" type="button">ส่งคำขอลา</button>

    <div id="leaveResult" class="status leave-result">
      <div id="leaveResultTitle" class="title"></div>
      <div id="leaveResultBody"></div>
    </div>
  </section>

  <section id="attendance" class="card hidden">
    <div class="label">รูปหลักฐาน</div>
    <div class="camera">
      <div id="placeholder" class="placeholder">📷<br>ถ่ายรูปก่อนลงเวลา</div>
      <img id="preview">
    </div>

    <label class="filebtn" for="photo">📷 ถ่ายรูป / เลือกรูป</label>
    <input id="photo" type="file" accept="image/*" capture="user">

    <button id="checkin" disabled>ลงเวลาเข้างาน</button>
    <div class="note">เวลาอ้างอิงจากเซิร์ฟเวอร์ระบบ และประทับลงบนรูปก่อนบันทึก Google Drive</div>

    <div id="result" class="status">
      <div id="resultTitle" class="title"></div>
      <div id="resultBody"></div>
    </div>
  </section>
</main>

<iframe name="uploadFrame" id="uploadFrame" style="display:none"></iframe>
<form id="uploadForm" method="POST" target="uploadFrame" style="display:none">
  <input type="hidden" name="action" value="checkin_upload">
  <input type="hidden" name="requestId" id="formRequestId">
  <input type="hidden" name="lineUserId" id="formLineUserId">
  <input type="hidden" name="imageData" id="formImageData">
</form>

<script>
const LIFF_ID = "2011542380-TZ4yYBwF";
const API_URL = "https://bunjerd-line-webhook.ss-soematerial.workers.dev";
const pageMode =
  new URLSearchParams(window.location.search).get("mode") || "attendance";

function applyPageMode() {
  const attendanceBtn = document.getElementById("attendanceModeBtn");
  const leaveBtn = document.getElementById("leaveModeBtn");
  const attendance = document.getElementById("attendance");
  const leave = document.getElementById("leaveSection");

  if (!attendance || !leave) return;

  if (pageMode === "leave") {
    attendance.classList.add("hidden");
    leave.classList.remove("hidden");

    if (attendanceBtn) attendanceBtn.classList.remove("active");
    if (leaveBtn) leaveBtn.classList.add("active");

    if (typeof setDefaultLeaveDates === "function") {
      setDefaultLeaveDates();
    }
  } else {
    leave.classList.add("hidden");
    attendance.classList.remove("hidden");

    if (leaveBtn) leaveBtn.classList.remove("active");
    if (attendanceBtn) attendanceBtn.classList.add("active");
  }
}


let lineUserId = "";
let employee = null;
let profile = null;

const debug = document.getElementById("debug");
const photo = document.getElementById("photo");
const checkinBtn = document.getElementById("checkin");
const attendanceModeBtn = document.getElementById("attendanceModeBtn");
const leaveModeBtn = document.getElementById("leaveModeBtn");
const leaveSection = document.getElementById("leaveSection");
const attendanceSection = document.getElementById("attendance");
const submitLeaveBtn = document.getElementById("submitLeave");

attendanceModeBtn.addEventListener("click", () => {
  attendanceModeBtn.classList.add("active");
  leaveModeBtn.classList.remove("active");
  attendanceSection.classList.remove("hidden");
  leaveSection.classList.add("hidden");
});

leaveModeBtn.addEventListener("click", () => {
  leaveModeBtn.classList.add("active");
  attendanceModeBtn.classList.remove("active");
  leaveSection.classList.remove("hidden");
  attendanceSection.classList.add("hidden");
  setDefaultLeaveDates();
});

function setDefaultLeaveDates() {
  const start = document.getElementById("leaveStartDate");
  const end = document.getElementById("leaveEndDate");

  if (!start.value) {
    const today = new Date();
    const local = new Date(
      today.getTime() -
      today.getTimezoneOffset() * 60000
    ).toISOString().slice(0,10);

    start.value = local;
    end.value = local;
  }
}

submitLeaveBtn.addEventListener("click", async () => {
  if (!employee || !lineUserId) {
    return showLeaveResult(false, "ไม่พบข้อมูลพนักงาน");
  }

  const leaveType = document.getElementById("leaveType").value;
  const startDate = document.getElementById("leaveStartDate").value;
  const endDate = document.getElementById("leaveEndDate").value;
  const reason = document.getElementById("leaveReason").value.trim();

  if (!leaveType) {
    return showLeaveResult(false, "กรุณาเลือกประเภทการลา");
  }

  if (!startDate || !endDate) {
    return showLeaveResult(false, "กรุณาเลือกวันที่ลา");
  }

  if (startDate > endDate) {
    return showLeaveResult(false, "วันที่สิ้นสุดต้องไม่น้อยกว่าวันเริ่มลา");
  }

  if (!reason) {
    return showLeaveResult(false, "กรุณาระบุเหตุผลการลา");
  }

  submitLeaveBtn.disabled = true;
  submitLeaveBtn.textContent = "กำลังส่งคำขอ...";

  try {
    const result = await api({
      action: "leave_request",
      lineUserId,
      leaveType,
      startDate,
      endDate,
      reason
    });

    if (!result.success) {
      showLeaveResult(
        false,
        result.message || result.error || "ส่งคำขอลาไม่สำเร็จ"
      );
      return;
    }

    showLeaveResult(
      true,
      "ส่งคำขอลาแล้ว",
      [
        ["ประเภท", result.leaveType || leaveType],
        ["วันที่", formatLeaveDateRange(startDate, endDate)],
        ["สถานะ", result.status || "รออนุมัติ"]
      ]
    );

    document.getElementById("leaveType").value = "";
    document.getElementById("leaveReason").value = "";

  } catch (err) {
    showLeaveResult(
      false,
      err.message || String(err)
    );
  } finally {
    submitLeaveBtn.disabled = false;
    submitLeaveBtn.textContent = "ส่งคำขอลา";
  }
});

function showLeaveResult(success, message, rows) {
  const box = document.getElementById("leaveResult");
  const title = document.getElementById("leaveResultTitle");
  const body = document.getElementById("leaveResultBody");

  box.className = "status show " + (success ? "ok" : "error");
  title.textContent = success ? "ส่งคำขอลาแล้ว" : "เกิดข้อผิดพลาด";

  if (!rows || !rows.length) {
    body.innerHTML = "<div class='sub'>" + escapeHtml(message || "") + "</div>";
    return;
  }

  body.innerHTML =
    "<div class='sub' style='margin-bottom:8px'>" +
    escapeHtml(message || "") +
    "</div>" +
    rows.map(r =>
      "<div class='row'><span>" +
      escapeHtml(r[0]) +
      "</span><strong>" +
      escapeHtml(r[1]) +
      "</strong></div>"
    ).join("");
}

function formatLeaveDateRange(startDate, endDate) {
  if (startDate === endDate) return formatThaiDateShort(startDate);
  return formatThaiDateShort(startDate) + " - " + formatThaiDateShort(endDate);
}

function formatThaiDateShort(iso) {
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return iso || "-";

  const months = [
    "", "ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.",
    "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."
  ];

  return Number(m[3]) + " " +
    months[Number(m[2])] + " " +
    String(Number(m[1]) + 543).slice(-2);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function log(s) {
  debug.textContent += "\n" + s;
}

/**
 * JSONP instead of fetch().
 * This avoids CORS/redirect problems between GitHub Pages
 * and Google Apps Script ContentService.
 */
function api(params) {
  return new Promise((resolve, reject) => {
    const callbackName =
      "__bunjerd_cb_" + Date.now() + "_" + Math.floor(Math.random()*100000);

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("ระบบใช้เวลานานกว่าปกติ กรุณาลองอีกครั้ง"));
    }, 25000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = (data) => {
      cleanup();
      resolve(data);
    };

    const qs = new URLSearchParams({
      ...params,
      callback: callbackName,
      _t: Date.now()
    });

    const script = document.createElement("script");
    script.src = API_URL + "?" + qs.toString();
    script.async = true;

    script.onerror = () => {
      cleanup();
      reject(new Error("เชื่อมต่อ Apps Script ไม่สำเร็จ"));
    };

    document.head.appendChild(script);
  });
}

window.addEventListener("load", init);

async function init() {
  debug.textContent = "1. HTML loaded ✅";

  try {
    if (typeof liff === "undefined") throw new Error("LIFF SDK not loaded");
    log("2. LIFF SDK loaded ✅");

    await liff.init({liffId: LIFF_ID});
    log("3. liff.init() ✅");

    if (!liff.isLoggedIn()) {
      log("4. Redirect to LINE login...");
      liff.login();
      return;
    }

    log("4. LINE logged in ✅");

    profile = await liff.getProfile();
    lineUserId = profile.userId;
    log("5. getProfile() ✅");
    log("LINE User ID: " + lineUserId);

    if (profile.pictureUrl) document.getElementById("avatar").src = profile.pictureUrl;

    await loadEmployee();

  } catch(err) {
    document.getElementById("loading").classList.add("hidden");
    showProfileError(err.message || String(err));
    log("ERROR ❌ " + (err.message || String(err)));
  }
}

async function loadEmployee() {
  try {
    log("6. Loading employee via JSONP...");

    const r = await api({
      action:"employee",
      lineUserId
    });

    document.getElementById("loading").classList.add("hidden");

    if (!r.success) {
      if (r.error === "EMPLOYEE_NOT_FOUND") {
        showProfileError("ยังไม่ได้ลงทะเบียน LINE นี้เป็นพนักงาน\nLINE User ID: " + lineUserId);
      } else {
        showProfileError(r.message || r.error || "โหลดข้อมูลพนักงานไม่สำเร็จ");
      }
      return;
    }

    employee = r.employee;

    document.getElementById("name").textContent = employee.name || profile.displayName || "-";
    document.getElementById("position").textContent = employee.position || "พนักงาน";
    document.getElementById("scheduled").textContent = (employee.startTime || "16:00") + " น.";
    document.getElementById("profile").classList.remove("hidden");
    document.getElementById("workActions").classList.remove("hidden");
    document.getElementById("attendance").classList.remove("hidden");
    applyPageMode();
    document.getElementById("serverText").textContent = "ระบบพร้อมใช้งาน";
    log("6. Employee loaded ✅");
  } catch(err) {
    document.getElementById("loading").classList.add("hidden");
    showProfileError(err.message || String(err));
    log("API ERROR ❌ " + (err.message || String(err)));
  }
}

photo.addEventListener("change", () => {
  const f = photo.files && photo.files[0];
  if (!f) return;
  document.getElementById("preview").src = URL.createObjectURL(f);
  document.getElementById("preview").style.display = "block";
  document.getElementById("placeholder").style.display = "none";
  checkinBtn.disabled = !employee;
});

checkinBtn.addEventListener("click", async () => {
  if (!employee || !lineUserId) {
    return showResultError(
      "ไม่พบข้อมูลพนักงาน"
    );
  }

  if (
    !photo.files ||
    !photo.files[0]
  ) {
    return showResultError(
      "กรุณาถ่ายรูปก่อนลงเวลา"
    );
  }

  checkinBtn.disabled = true;
  checkinBtn.textContent =
    "กำลังขอเวลามาตรฐาน...";

  log(
    "7. Requesting server timestamp..."
  );

  try {
    const prep = await api({
      action: "prepare_checkin",
      lineUserId
    });

    if (!prep.success) {
      if (
        prep.error ===
        "ALREADY_CHECKED_IN"
      ) {
        showResultError(
          "วันนี้ลงเวลาแล้ว เวลา " +
          (prep.checkInTime || "-") +
          " น. (" +
          (prep.status || "-") +
          ")"
        );
      } else {
        showResultError(
          prep.message ||
          prep.error ||
          "ขอเวลามาตรฐานไม่สำเร็จ"
        );
      }

      return;
    }

    const p =
      prep.prepared;

    log(
      "8. Server time ✅ " +
      p.displayDate +
      " " +
      p.displayTime +
      " [" +
      p.timeSource +
      "]"
    );

    checkinBtn.textContent =
      "กำลังประทับเวลาในรูป...";

    const stampedImage =
      await stampAttendancePhoto(
        photo.files[0],
        employee.name,
        p.displayDate,
        p.displayTime,
        p.timeSource,
        p.status
      );

    const preview =
      document.getElementById(
        "preview"
      );

    preview.src =
      stampedImage;

    preview.style.display =
      "block";

    log(
      "9. Timestamp stamped on photo ✅"
    );

    document
      .getElementById(
        "formRequestId"
      )
      .value =
        p.requestId;

    document
      .getElementById(
        "formLineUserId"
      )
      .value =
        lineUserId;

    document
      .getElementById(
        "formImageData"
      )
      .value =
        stampedImage;

    const form =
      document.getElementById(
        "uploadForm"
      );

    form.action =
      API_URL;

    checkinBtn.textContent =
      "กำลังบันทึกลงเวลา...";

    log(
      "10. Uploading stamped photo..."
    );

    // Register listener before submit so a fast response is never missed.
    const responsePromise =
      waitForCheckinResponse(
        p.requestId,
        15000
      );

    form.submit();

    // One upload request only. No result polling.
    const result =
      await responsePromise;

    if (!result.success) {
      if (
        result.error ===
        "ALREADY_CHECKED_IN"
      ) {
        showResultError(
          "วันนี้ลงเวลาแล้ว เวลา " +
          (result.checkInTime || "-") +
          " น. (" +
          (result.status || "-") +
          ")"
        );

      } else if (
        result.message ===
          "SYSTEM_BUSY_PLEASE_RETRY" ||
        result.error ===
          "SYSTEM_BUSY_PLEASE_RETRY"
      ) {
        showResultError(
          "มีพนักงานกำลังลงเวลาพร้อมกัน กรุณาลองอีกครั้ง"
        );

      } else {
        showResultError(
          result.message ||
          result.error ||
          "ลงเวลาไม่สำเร็จ"
        );
      }

      return;
    }

    log(
      "11. Photo saved ✅"
    );

    log(
      "12. Attendance saved ✅"
    );

    renderSuccess(
      result
    );

  } catch (err) {
    log(
      "CHECKIN ERROR ❌ " +
      (
        err.message ||
        String(err)
      )
    );

    showResultError(
      err.message ||
      String(err)
    );

  } finally {
    checkinBtn.disabled = false;
    checkinBtn.textContent =
      "ลงเวลาเข้างาน";
  }
});


function waitForCheckinResponse(
  requestId,
  timeoutMs
) {
  return new Promise(
    (resolve, reject) => {
      let finished = false;

      const timer =
        setTimeout(async () => {
          cleanup();

          try {
            const recovered =
              await recoverCheckinResult(
                requestId
              );

            resolve(
              recovered
            );

          } catch (recoveryErr) {
            reject(
              new Error(
                "ระบบบันทึกผลแล้วแต่หน้าไม่ตอบกลับ กรุณาตรวจสอบ Attendance ก่อนลองใหม่"
              )
            );
          }
        }, timeoutMs);

      function cleanup() {
        if (finished) {
          return;
        }

        finished = true;

        clearTimeout(
          timer
        );

        window.removeEventListener(
          "message",
          onMessage
        );
      }

      function onMessage(event) {
        const data =
          event.data;

        if (
          !data ||
          data.type !==
            "BUNJERD_CHECKIN_RESULT"
        ) {
          return;
        }

        if (
          String(
            data.requestId || ""
          ) !==
          String(
            requestId || ""
          )
        ) {
          return;
        }

        const origin =
          String(
            event.origin || ""
          );

        const apiOrigin =
          new URL(
            API_URL
          ).origin;

        const allowedOrigin =
          !origin ||
          origin === "null" ||
          origin === apiOrigin ||
          origin ===
            "https://script.google.com" ||
          origin.endsWith(
            ".googleusercontent.com"
          );

        if (!allowedOrigin) {
          return;
        }

        cleanup();

        resolve(
          data.result || {
            success: false,
            error:
              "EMPTY_CHECKIN_RESULT"
          }
        );
      }

      window.addEventListener(
        "message",
        onMessage
      );
    }
  );
}


async function recoverCheckinResult(
  requestId
) {
  // Recovery only when postMessage was not received.
  // Maximum two lightweight reads; this is not continuous polling.
  for (
    let attempt = 0;
    attempt < 2;
    attempt++
  ) {
    try {
      const result =
        await api({
          action: "result",
          requestId
        });

      if (
        result &&
        !result.pending
      ) {
        return result;
      }

    } catch (err) {
      log(
        "Recovery attempt " +
        (attempt + 1) +
        " failed"
      );
    }

    if (attempt === 0) {
      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            1800
          )
      );
    }
  }

  throw new Error(
    "CHECKIN_RESULT_NOT_AVAILABLE"
  );
}


function stampAttendancePhoto(
  file,
  employeeName,
  displayDate,
  displayTime,
  timeSource,
  status
) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl =
      URL.createObjectURL(file);

    img.onload = () => {
      try {
        const maxSize = 720;

        let width = img.width;
        let height = img.height;

        const scale = Math.min(
          1,
          maxSize /
          Math.max(width, height)
        );

        width = Math.round(
          width * scale
        );

        height = Math.round(
          height * scale
        );

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        const overlayH = Math.max(
          120,
          Math.round(height * 0.24)
        );

        const top =
          height - overlayH;

        ctx.fillStyle =
          "rgba(0,0,0,0.72)";

        ctx.fillRect(
          0,
          top,
          width,
          overlayH
        );

        const pad = Math.max(
          18,
          Math.round(width * 0.04)
        );

        ctx.fillStyle = "#ffffff";
        ctx.font =
          `700 ${Math.max(
            16,
            Math.round(width * 0.035)
          )}px sans-serif`;

        ctx.fillText(
          "BUNJERD 90'S STAFF",
          pad,
          top + 30
        );

        ctx.font =
          `600 ${Math.max(
            15,
            Math.round(width * 0.032)
          )}px sans-serif`;

        ctx.fillText(
          employeeName,
          pad,
          top + 58
        );

        ctx.fillStyle = "#dddddd";
        ctx.font =
          `500 ${Math.max(
            12,
            Math.round(width * 0.025)
          )}px sans-serif`;

        ctx.fillText(
          displayDate +
          " • " +
          timeSource,
          pad,
          top + 84
        );

        ctx.fillStyle = "#f3b72d";
        ctx.font =
          `800 ${Math.max(
            24,
            Math.round(width * 0.065)
          )}px sans-serif`;

        ctx.fillText(
          displayTime,
          pad,
          height - 18
        );

        ctx.textAlign = "right";
        ctx.fillStyle =
          status === "สาย"
            ? "#ff6868"
            : "#70dc7d";

        ctx.font =
          `700 ${Math.max(
            16,
            Math.round(width * 0.033)
          )}px sans-serif`;

        ctx.fillText(
          status,
          width - pad,
          height - 22
        );

        ctx.textAlign = "left";

        const dataUrl =
          canvas.toDataURL(
            "image/jpeg",
            0.50
          );

        URL.revokeObjectURL(
          objectUrl
        );

        resolve(dataUrl);

      } catch(err) {
        URL.revokeObjectURL(
          objectUrl
        );
        reject(err);
      }
    };

    img.onerror = () => {
      URL.revokeObjectURL(
        objectUrl
      );

      reject(
        new Error(
          "อ่านรูปภาพไม่สำเร็จ"
        )
      );
    };

    img.src = objectUrl;
  });
}


function renderSuccess(r) {
  const late =
    r.status === "สาย" ||
    Number(r.lateMinutes || 0) > 0;

  const statusText =
    late
      ? "สาย " + Number(r.lateMinutes || 0) + " นาที"
      : "ตรงเวลา";

  const rows = [
    ["พนักงาน", r.employeeName || "-"],
    ["วันที่", formatThaiDateShort(r.date)],
    ["เวลาเข้า", (r.checkInTime || "-") + " น."],
    ["เวลาเข้างาน", (r.scheduledTime || "-") + " น."],
    ["สถานะ", statusText]
  ];

  const box =
    document.getElementById("result");

  box.className =
    "status show " +
    (late ? "late" : "ok");

  document
    .getElementById("resultTitle")
    .textContent =
      late
        ? "🔴 ลงเวลาสำเร็จ — มาสาย"
        : "✅ ลงเวลาสำเร็จ";

  document
    .getElementById("resultBody")
    .innerHTML =
      rows
        .map(
          ([a,b]) =>
            `<div class="row"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`
        )
        .join("");
}

function showProfileError(msg) {
  const box = document.getElementById("profileError");
  box.className = "status show error";
  box.innerHTML = '<div class="title">⚠️ ไม่สามารถเข้าใช้งาน</div><div style="white-space:pre-wrap">'+esc(msg)+'</div>';
}

function showResultError(msg) {
  const box = document.getElementById("result");
  box.className = "status show error";
  document.getElementById("resultTitle").textContent = "⚠️ ไม่สามารถลงเวลาได้";
  document.getElementById("resultBody").innerHTML = "<div>"+esc(msg)+"</div>";
}

function esc(s) {
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
